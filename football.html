<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>HonestTom | Mattel Electronic Football</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    /* ── BASE & BACKGROUND ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('./football_stiff.png') center/cover no-repeat fixed;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 40px 20px; font-family: 'Inter', sans-serif; user-select: none;
    }

    /* ── HANDHELD UNIT ── */
    .handheld {
      width: 540px; height: 920px;
      background: #e8dab2; /* Aged cream plastic */
      border-radius: 30px 30px 40px 40px;
      position: relative;
      box-shadow: 
        0 50px 100px rgba(0,0,0,0.8),
        inset 0 4px 0 rgba(255,255,255,0.6),
        inset 0 -10px 20px rgba(0,0,0,0.2);
      padding: 30px;
      display: flex; flex-direction: column; align-items: center;
      border: 2px solid rgba(0,0,0,0.1);
    }

    /* ── TOP BRAND BAR ── */
    .mattel-bar {
      width: 100%; height: 50px;
      background: #3a8cc1; /* Classic Blue */
      border: 4px solid #fff;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 30px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
    }
    .mattel-text { color: white; font-weight: 900; letter-spacing: 0.2em; font-size: 1.4rem; text-transform: uppercase; font-style: italic; }

    /* ── STADIUM BEZEL ── */
    .stadium-wrap {
      width: 100%; height: 280px;
      background: #dfcfaf; /* Slightly darker inner plastic */
      border-radius: 140px;
      padding: 10px;
      display: flex; align-items: center; justify-content: center;
      border: 4px solid rgba(0,0,0,0.05);
      box-shadow: inset 0 10px 30px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
    }

    /* Ribbed effect */
    .stadium-wrap::before {
      content: ''; position: absolute; inset: 0;
      background: repeating-radial-gradient(circle, transparent, transparent 8px, rgba(0,0,0,0.03) 8px, rgba(0,0,0,0.03) 10px);
      pointer-events: none;
    }

    .display-area {
      width: 85%; height: 180px;
      background: #1a4a2a; /* Green field plastic */
      border-radius: 20px;
      border: 6px solid #fff;
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.4);
    }

    /* Stats bar above field */
    .stat-bar {
      width: 100%; height: 40px; background: rgba(0,0,0,0.8);
      display: flex; justify-content: space-around; align-items: center;
      padding: 0 10px; color: #ff4a00; font-family: 'Share Tech Mono', monospace; font-size: 1.2rem;
    }

    #led-canvas { width: 100%; height: 140px; display: block; }

    /* ── CONTROL PANEL ── */
    .control-panel {
      width: 100%; height: 320px;
      background: #1a1a1a; /* Black metal plate */
      margin-top: 40px;
      border-radius: 15px;
      border: 4px solid #333;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: 1fr 1fr;
      gap: 20px;
      position: relative;
    }

    .btn {
      width: 100px; height: 100px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.8rem; color: white;
      box-shadow: 0 8px 0 rgba(0,0,0,0.5);
      transition: transform 0.05s, box-shadow 0.05s;
    }
    .btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,0.5); }

    .btn-blue { background: #3a8cc1; }
    .btn-teal { background: #3a8cc1; }
    .btn-orange { background: #f28d21; }
    .btn-red { background: #e64522; }

    /* Directional cluster */
    .d-pad { display: flex; flex-direction: column; gap: 10px; align-items: center; }

    /* ── BOTTOM LOGO ── */
    .bottom-logo {
      margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-bottom: 20px;
    }
    .speaker {
      width: 80%; height: 80px;
      background: repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(0,0,0,0.1) 15px, rgba(0,0,0,0.1) 20px);
    }
    .helmet-logo { width: 200px; padding: 15px; border: 4px solid #3a8cc1; color: #3a8cc1; font-weight: 900; font-size: 2rem; text-align: center; border-radius: 10px; }

    /* ── VIKINGS SQUISHY BUTTON ── */
    .team-select { margin-top: 30px; display: flex; justify-content: center; }
    .squishy-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; outline: none; }
    .helmet-circle {
      width: 100px; height: 100px; border-radius: 50%; overflow: hidden; border: 4px solid #4f2683; background: #000;
      box-shadow: 0 8px 0 #2c1250, 0 12px 20px rgba(0,0,0,0.4); transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .helmet-circle img { width: 115%; height: 115%; object-fit: cover; clip-path: circle(43%); margin-left: -1%; pointer-events: none; }
    .squishy-btn:active .helmet-circle { transform: translateY(8px) scale(0.95, 0.88); box-shadow: 0 0 0 #2c1250, 0 2px 5px rgba(0,0,0,0.3); }
    .squishy-name { font-size: 0.8rem; font-weight: 900; color: #ffd060; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,1); }

  </style>
</head>
<body>

  <div class="handheld">
    
    <!-- Brand -->
    <div class="mattel-bar">
      <span class="mattel-text">HonestTom Electronics™</span>
    </div>

    <!-- Display Stadium -->
    <div class="stadium-wrap">
      <div class="display-area">
        <div class="stat-bar">
          <span>00</span><span>1</span><span>10</span><span>99</span>
        </div>
        <canvas id="led-canvas"></canvas>
      </div>
    </div>

    <!-- Control Plate -->
    <div class="control-panel">
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn-blue">ST</button>
        <button class="btn btn-blue">SC</button>
      </div>
      
      <div style="display:flex; align-items:center; justify-content:center;">
        <button class="btn btn-teal" style="width:120px; height:120px; font-size:3rem;">K</button>
      </div>

      <div class="d-pad">
        <button class="btn btn-red">▲</button>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-orange">◀▶</button>
          <button class="btn btn-red">▼</button>
        </div>
      </div>
    </div>

    <!-- Speaker & Logo -->
    <div class="bottom-logo">
      <div class="speaker"></div>
      <div class="helmet-logo">FOOTBALL</div>
    </div>

  </div>

  <!-- Team Select -->
  <div class="team-select">
    <button class="squishy-btn" onclick="location.reload()">
      <div class="helmet-circle"><img src="./helmet_vikings.png" alt="Vikings"></div>
      <div class="squishy-name">Purple Peeps</div>
    </button>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById('led-canvas');
      var ctx    = canvas.getContext('2d');
      canvas.width = 400; canvas.height = 140;
      
      function render() {
        ctx.fillStyle = '#1a4a2a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Yard lines
        ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
        for(let i=1; i<10; i++) { ctx.beginPath(); ctx.moveTo(i*40, 0); ctx.lineTo(i*40, canvas.height); ctx.stroke(); }
        // Player
        ctx.fillStyle = '#ff4a00'; ctx.shadowColor = '#ff3000'; ctx.shadowBlur = 10;
        ctx.fillRect(80, 60, 25, 8);
      }
      render();
    })();
  </script>

</body>
</html>
