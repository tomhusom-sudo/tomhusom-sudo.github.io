<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Mattel Electronic Football — Reimagined</title>

  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── PAGE ── */
    html, body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(60,30,0,0.35) 0%, transparent 65%),
        #0d0b08;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px 48px;
      font-family: 'Inter', system-ui, sans-serif;
      user-select: none;
    }

    /* ── BACK LINK ── */
    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #5a4a28;
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 28px;
      transition: color 0.2s;
    }
    .nav-back:hover { color: #9a8450; }

    /* ── CONSOLE SHELL ── */
    .console {
      width: min(620px, 100%);
      background:
        linear-gradient(170deg,
          #f5ecd8 0%,
          #e8d9be 20%,
          #d8c8a4 50%,
          #c4b088 80%,
          #b89e70 100%);
      border-radius: 24px 24px 36px 36px;
      padding: 22px 24px 30px;
      position: relative;
      box-shadow:
        0 40px 100px rgba(0,0,0,0.85),
        0 16px 40px rgba(0,0,0,0.6),
        inset 0 2px 0 rgba(255,255,255,0.6),
        inset 0 -5px 10px rgba(0,0,0,0.3),
        inset 3px 0 4px rgba(255,255,255,0.2),
        inset -3px 0 4px rgba(0,0,0,0.1);
    }

    /* Outer rim highlight */
    .console::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px 24px 36px 36px;
      border: 1.5px solid rgba(255,255,255,0.35);
      pointer-events: none;
    }

    /* Subtle mold-line crease at bottom third of console */
    .console::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      bottom: 88px;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0,0,0,0.12) 15%,
        rgba(0,0,0,0.18) 50%,
        rgba(0,0,0,0.12) 85%,
        transparent 100%);
      pointer-events: none;
    }

    /* ── BRAND BAR ── */
    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 6px 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(120,90,40,0.2);
    }

    .brand-company {
      font-size: 0.54rem;
      font-weight: 800;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #7a6238;
      font-style: italic;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #b81200;
      text-shadow:
        0 1px 0 rgba(255,255,255,0.35),
        0 -1px 0 rgba(0,0,0,0.2);
    }

    /* ── DISPLAY SECTION ── */
    .display-section {
      display: flex;
      gap: 12px;
      align-items: stretch;
      margin-bottom: 20px;
    }

    /* Stat columns flanking the field */
    .stat-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 56px;
      flex-shrink: 0;
    }

    .stat-box {
      background: #050302;
      border-radius: 7px;
      padding: 7px 9px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow:
        inset 0 3px 8px rgba(0,0,0,0.95),
        inset 0 0 0 1px rgba(0,0,0,0.6),
        0 1px 0 rgba(255,255,255,0.1);
    }

    .stat-label {
      display: block;
      font-size: 0.42rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #3a1c06;
      margin-bottom: 4px;
    }

    .stat-value {
      display: block;
      font-family: 'Courier New', monospace;
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1;
      color: #ff4a00;
      text-shadow:
        0 0 6px #ff3000,
        0 0 14px rgba(255,50,0,0.5),
        0 0 28px rgba(220,30,0,0.25);
      letter-spacing: 0.04em;
    }

    /* ── LED BEZEL ── */
    .led-bezel {
      flex: 1;
      background: #060401;
      border-radius: 10px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
      box-shadow:
        inset 0 5px 18px rgba(0,0,0,0.98),
        inset 0 2px 5px rgba(0,0,0,0.9),
        inset 0 0 0 2px #020100,
        0 2px 0 rgba(255,255,255,0.1);
    }

    /* Lens tint — warm dark amber overlay, just like the original hardware lens */
    .led-bezel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%,
        rgba(80,30,0,0.08) 0%,
        rgba(20,8,0,0.22) 100%);
      pointer-events: none;
      z-index: 2;
      border-radius: 10px;
    }

    /* Subtle scanline grid */
    .led-bezel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.06) 3px,
        rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 3;
      border-radius: 10px;
    }

    #led-canvas {
      display: block;
      position: relative;
      z-index: 1;
      max-width: 100%;
      height: auto;
    }

    /* Field label */
    .field-label {
      position: absolute;
      bottom: 5px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.38rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #2a1205;
      z-index: 4;
    }

    /* ── CONTROLS ROW ── */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 4px;
      position: relative;
      z-index: 1;
    }

    .btn-cluster {
      display: flex;
      gap: 7px;
    }

    /* Red game button */
    .gbtn {
      background: linear-gradient(175deg, #e42222 0%, #920c0c 100%);
      color: rgba(255,255,255,0.92);
      border: none;
      border-radius: 5px;
      padding: 7px 9px;
      font-size: 0.45rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      min-width: 40px;
      text-align: center;
      line-height: 1.4;
      box-shadow:
        0 4px 0 #5e0000,
        0 5px 10px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,130,130,0.3);
      transition: transform 0.07s, box-shadow 0.07s;
    }

    .gbtn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #5e0000, 0 2px 4px rgba(0,0,0,0.4);
    }

    /* Direction pad */
    .d-pad {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    .d-row {
      display: flex;
      gap: 4px;
    }

    .dbtn {
      background: linear-gradient(175deg, #e42222 0%, #920c0c 100%);
      border: none;
      border-radius: 4px;
      width: 34px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.9);
      box-shadow:
        0 3px 0 #5e0000,
        0 4px 8px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,130,130,0.25);
      transition: transform 0.07s, box-shadow 0.07s;
    }

    .dbtn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #5e0000;
    }

    .dbtn.center-btn {
      background: linear-gradient(175deg, #cc1818 0%, #780808 100%);
      font-size: 0.38rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.85);
    }

    /* ── BOTTOM TAGLINE ── */
    .console-tagline {
      text-align: center;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #6a5230;
      margin-top: 14px;
      opacity: 0.75;
    }

    /* ── PAGE FOOTER ── */
    .page-footer {
      margin-top: 28px;
      text-align: center;
    }

    .page-footer p {
      font-size: 0.7rem;
      color: #4a3818;
      letter-spacing: 0.08em;
    }

    .page-footer p span {
      color: #6a5228;
    }

<body>

  <a href="./dashboard.html" class="nav-back">← Dashboard</a>

  <div class="console">

    <!-- Brand -->
    <div class="brand-bar">
      <span class="brand-company">Mattel Electronics</span>
      <span class="brand-title">Football</span>
    </div>

    <!-- Display: [SCORE/DOWN] [LED FIELD] [TIME/YDS] -->
    <div class="display-section">

      <!-- Left stat column -->
      <div class="stat-col">
        <div class="stat-box">
          <span class="stat-label">Score</span>
          <span class="stat-value" id="disp-score">00</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Down</span>
          <span class="stat-value" id="disp-down">1</span>
        </div>
      </div>

      <!-- Center LED field -->
      <div class="led-bezel">
        <canvas id="led-canvas"></canvas>
        <div class="field-label">· · · · · · · · · ·</div>
      </div>

      <!-- Right stat column -->
      <div class="stat-col">
        <div class="stat-box">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="disp-time">99</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Yds</span>
          <span class="stat-value" id="disp-yds">10</span>
        </div>
      </div>

    </div>

    <!-- Controls -->
    <div class="controls-row">

      <!-- Left cluster: status buttons -->
      <div class="btn-cluster">
        <button class="gbtn">Score</button>
        <button class="gbtn">Down</button>
        <button class="gbtn">Status</button>
      </div>

      <!-- Center: directional pad -->
      <div class="d-pad">
        <div class="d-row">
          <button class="dbtn">▲</button>
        </div>
        <div class="d-row">
          <button class="dbtn" id="btn-left">◀</button>
          <button class="dbtn center-btn">Run</button>
          <button class="dbtn" id="btn-right">▶</button>
        </div>
        <div class="d-row">
          <button class="dbtn">▼</button>
        </div>
      </div>

      <!-- Right cluster: game mode buttons -->
      <div class="btn-cluster">
        <button class="gbtn">Pro 1</button>
        <button class="gbtn">K · O</button>
        <button class="gbtn">Pro 2</button>
      </div>

    </div>

    <div class="console-tagline">The 1977 Classic — Rebuilt for the Browser</div>

  </div>

  <div class="page-footer">
    <p>Tom's Love of Mattel Electronic Football Reimagined &nbsp;·&nbsp; <span>Vanilla JS · HTML5 Canvas · Retro Gaming</span></p>
  </div>

  <script>
  // ─────────────────────────────────────────────────────────────────
  //  LED FIELD DISPLAY — visual layout only, no game logic yet
  // ─────────────────────────────────────────────────────────────────

  (function () {
    var canvas = document.getElementById('led-canvas');
    var ctx    = canvas.getContext('2d');

    // ── GRID CONFIG ──
    var COLS   = 10;   // field columns (left end → right end zone)
    var ROWS   = 7;    // field rows (top to bottom)
    var CW     = 32;   // cell width  (LED dash width)
    var CH     = 13;   // cell height (LED dash height)
    var GX     = 5;    // horizontal gap between cells
    var GY     = 7;    // vertical gap between cells

    canvas.width  = COLS * (CW + GX) - GX;   // 365px
    canvas.height = ROWS * (CH + GY) - GY;   // 133px

    // ── COLORS ──
    var COL_BG      = '#060401';
    var COL_UNLIT   = '#1e0b02';   // barely-there dark brown — unlit LED
    var COL_DEF     = '#ff3e00';   // defenders — orange-red
    var COL_OFF     = '#ffb040';   // offense — brighter amber-orange (ball carrier)
    var COL_OFF_TOP = '#ffe080';   // inner bright highlight on offense dash

    // ── FIELD STATE ──
    // null = empty  'O' = offense (you)  'D' = defense
    var cells = [];
    for (var r = 0; r < ROWS; r++) {
      cells[r] = [];
      for (var c = 0; c < COLS; c++) { cells[r][c] = null; }
    }

    // Demo: offense at col 3, row 3 (mid-field, center row)
    cells[3][3] = 'O';

    // Defense — 5 defenders in a spread formation ahead of offense
    cells[1][6] = 'D';
    cells[2][5] = 'D';
    cells[3][7] = 'D';
    cells[4][5] = 'D';
    cells[5][6] = 'D';

    // ── HELPERS ──
    function cx(col) { return col * (CW + GX); }
    function cy(row) { return row * (CH + GY); }

    // Draw a single LED cell
    function drawCell(col, row, type) {
      var x  = cx(col);
      var y  = cy(row);
      var rx = CH / 2;   // corner radius = half height → perfect pill shape

      ctx.save();

      if (!type) {
        // ── Unlit LED: just a dim pill ──
        ctx.fillStyle = COL_UNLIT;
        ctx.beginPath();
        ctx.roundRect(x, y, CW, CH, rx);
        ctx.fill();

      } else if (type === 'O') {
        // ── Offense: two stacked mini-dashes ("=" shape) with bright glow ──
        // This matches the original Mattel hardware where the ball carrier
        // was rendered as a double-dash to distinguish from defenders.

        var dashH = Math.floor((CH - 3) / 2);  // height of each mini-dash
        var dashW = CW - 6;                      // width slightly inset

        // Outer glow layer
        ctx.shadowColor = '#ff5000';
        ctx.shadowBlur  = 20;
        ctx.fillStyle   = '#ff6020';
        ctx.beginPath();
        ctx.roundRect(x - 2, y - 2, CW + 4, CH + 4, rx + 2);
        ctx.fill();

        // Top dash
        ctx.shadowBlur = 12;
        ctx.fillStyle  = COL_OFF;
        ctx.beginPath();
        ctx.roundRect(x + 3, y + 1, dashW, dashH, dashH / 2);
        ctx.fill();

        // Bottom dash
        ctx.beginPath();
        ctx.roundRect(x + 3, y + CH - dashH - 1, dashW, dashH, dashH / 2);
        ctx.fill();

        // Inner bright highlight (top dash)
        ctx.shadowBlur = 4;
        ctx.fillStyle  = COL_OFF_TOP;
        ctx.beginPath();
        ctx.roundRect(x + 6, y + 2, dashW - 6, dashH - 2, 1);
        ctx.fill();

      } else if (type === 'D') {
        // ── Defense: single centered dash ──
        var defY = y + Math.floor((CH - 5) / 2);

        // Outer glow
        ctx.shadowColor = '#cc2800';
        ctx.shadowBlur  = 14;
        ctx.fillStyle   = '#cc2800';
        ctx.beginPath();
        ctx.roundRect(x, y, CW, CH, rx);
        ctx.fill();

        // Core dash
        ctx.shadowBlur = 6;
        ctx.fillStyle  = COL_DEF;
        ctx.beginPath();
        ctx.roundRect(x + 2, defY, CW - 4, 5, 2);
        ctx.fill();

        // Inner highlight
        ctx.shadowBlur = 0;
        ctx.fillStyle  = '#ff7040';
        ctx.beginPath();
        ctx.roundRect(x + 5, defY + 1, CW - 14, 2, 1);
        ctx.fill();
      }

      ctx.restore();
    }

    // Draw subtle yard-line markers between columns
    function drawYardMarkers() {
      // Very faint vertical lines between every 2 columns to suggest yard sections
      for (var c = 1; c < COLS; c++) {
        if (c % 2 === 0) continue;   // only odd gaps = every other column gap
        var x = cx(c) - Math.ceil(GX / 2);
        ctx.save();
        ctx.fillStyle = '#150800';
        ctx.fillRect(x, 2, 1, canvas.height - 4);
        ctx.restore();
      }
    }

    // ── MAIN RENDER ──
    function render() {
      // Background
      ctx.fillStyle = COL_BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Yard markers (behind LEDs)
      drawYardMarkers();

      // All LED cells
      for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
          drawCell(c, r, cells[r][c]);
        }
      }

      // End-zone shimmer: very subtle bright column on the far right (score zone)
      ctx.save();
      ctx.fillStyle = 'rgba(255,80,0,0.03)';
      ctx.fillRect(cx(COLS - 1) - GX, 0, CW + GX + 4, canvas.height);
      ctx.restore();
    }

    render();

  })();
  </script>

</body>
