<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HonestTom">
  <link rel="apple-touch-icon" href="/lincoln.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HonestTom | Football</title>
  <script>
    var VER = 'v=20260330_MERGED_V1';
    if (location.search.indexOf(VER) === -1) {
      location.replace(location.pathname + '?' + VER);
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── THEME VARIABLES ── */
    :root {
      --shell-light: #f5ecd8;
      --shell-mid:   #d8c8a4;
      --shell-dark:  #b89e70;
      --btn-top:     #e42222;
      --btn-bot:     #920c0c;
      --btn-shadow:  #5e0000;
      --btn-hl:      rgba(255,130,130,0.3);
      --brand-co:    #7a6238;
      --brand-title: #b81200;
      --tagline:     #6a5230;
    }

    /* ── PAGE ── */
    html, body {
      min-height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url('./football_stiff.png') center center / cover no-repeat fixed;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px 48px;
      font-family: 'Inter', system-ui, sans-serif; user-select: none;
    }

    .nav-back { display: inline-flex; align-items: center; gap: 6px; color: #5a4a28; text-decoration: none; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 28px; }

    /* ── CONSOLE SHELL ── */
    .console {
      width: min(620px, 100%);
      background: linear-gradient(170deg, var(--shell-light) 0%, var(--shell-mid) 50%, var(--shell-dark) 100%);
      border-radius: 24px 24px 36px 36px; padding: 22px 24px 30px; position: relative;
      box-shadow: 0 40px 100px rgba(0,0,0,0.85), inset 0 2px 0 rgba(255,255,255,0.6);
    }

    .brand-bar { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 12px; margin-bottom: 12px; border-bottom: 1px solid rgba(120,90,40,0.2); }
    .brand-company { font-size: 0.54rem; font-weight: 800; letter-spacing: 0.32em; text-transform: uppercase; color: var(--brand-co); font-style: italic; }
    .brand-title { font-size: 1.05rem; font-weight: 900; letter-spacing: 0.38em; text-transform: uppercase; color: var(--brand-title); text-shadow: 0 1px 0 rgba(255,255,255,0.35); }

    .display-section { display: flex; gap: 12px; align-items: stretch; margin-bottom: 20px; }
    .stat-col { display: flex; flex-direction: column; gap: 8px; width: 56px; flex-shrink: 0; }
    .stat-box { background: #050302; border-radius: 7px; padding: 7px 9px; flex: 1; display: flex; flex-direction: column; justify-content: center; box-shadow: inset 0 3px 8px rgba(0,0,0,0.95); }
    .stat-label { font-size: 0.42rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #3a1c06; margin-bottom: 4px; }
    .stat-value { font-family: 'Courier New', monospace; font-size: 1.25rem; font-weight: 900; color: #ff4a00; text-shadow: 0 0 6px #ff3000; }

    .led-bezel { flex: 1; background: #060401; border-radius: 10px; padding: 14px 16px; position: relative; overflow: hidden; box-shadow: inset 0 5px 18px rgba(0,0,0,0.98); }
    .led-bezel::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px); pointer-events: none; z-index: 3; border-radius: 10px; }
    #led-canvas { display: block; position: relative; z-index: 1; max-width: 100%; height: auto; }

    .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px; position: relative; z-index: 1; }
    .btn-cluster { display: flex; gap: 7px; }
    .gbtn { background: linear-gradient(175deg, var(--btn-top) 0%, var(--btn-bot) 100%); color: #fff; border: none; border-radius: 5px; padding: 7px 9px; font-size: 0.45rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 var(--btn-shadow); transition: transform 0.07s; }
    .gbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-shadow); }

    .d-pad { display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .dbtn { background: linear-gradient(175deg, var(--btn-top) 0%, var(--btn-bot) 100%); border: none; border-radius: 4px; width: 34px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; box-shadow: 0 3px 0 var(--btn-shadow); transition: transform 0.07s; }
    .dbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-shadow); }

    .console-tagline { text-align: center; font-size: 0.5rem; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--tagline); margin-top: 14px; opacity: 0.75; }

    /* ── SQUISHY TEAM SELECT ── */
    .team-select { width: min(620px, 100%); margin-top: 22px; border-radius: 18px; padding: 18px 14px 22px; text-align: center; }
    .team-grid { display: flex; justify-content: center; margin-top: 15px; }
    
    .squishy-btn { background: none; border: none; padding: 0; cursor: pointer; outline: none; display: flex; flex-direction: column; align-items: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
    .helmet-circle {
      width: 80px; height: 80px; border-radius: 50%; overflow: hidden; border: 3px solid #4f2683; background: #000;
      box-shadow: 0 8px 0 #2c1250, 0 12px 20px rgba(0,0,0,0.4); transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s ease;
    }
    .helmet-circle img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .squishy-btn:hover .helmet-circle { transform: translateY(-3px); box-shadow: 0 11px 0 #2c1250, 0 18px 25px rgba(0,0,0,0.5); }
    .squishy-btn:active .helmet-circle { transform: translateY(8px) scale(0.95, 0.88); box-shadow: 0 0 0 #2c1250, 0 2px 5px rgba(0,0,0,0.3); }
    .squishy-name { font-size: 0.6rem; font-weight: 900; color: #4f2683; text-transform: uppercase; margin-top: 4px; }

    .page-footer { margin-top: 28px; text-align: center; color: #4a3818; font-size: 0.7rem; }
  </style>
</head>
<body>

  <a href="./dashboard.html" class="nav-back">← Dashboard</a>

  <div class="console">
    <div class="brand-bar">
      <span class="brand-company" id="brand-company">Husom Electronics</span>
      <span class="brand-title">Football</span>
    </div>
    <div class="display-section">
      <div class="stat-col">
        <div class="stat-box"><span class="stat-label">Score</span><span class="stat-value" id="disp-score">00</span></div>
        <div class="stat-box"><span class="stat-label">Down</span><span class="stat-value" id="disp-down">1</span></div>
      </div>
      <div class="led-bezel"><canvas id="led-canvas"></canvas></div>
      <div class="stat-col">
        <div class="stat-box"><span class="stat-label">Time</span><span class="stat-value" id="disp-time">99</span></div>
        <div class="stat-box"><span class="stat-label">Yds</span><span class="stat-value" id="disp-yds">10</span></div>
      </div>
    </div>
    <div class="controls-row">
      <div class="btn-cluster"><button class="gbtn">Score</button><button class="gbtn">Down</button><button class="gbtn">Status</button></div>
      <div class="d-pad">
        <button class="dbtn">▲</button>
        <div style="display:flex; gap:4px;"><button class="dbtn">◀</button><button class="dbtn" style="font-size:0.38rem; filter:brightness(0.82);">Run</button><button class="dbtn">▶</button></div>
        <button class="dbtn">▼</button>
      </div>
      <div class="btn-cluster"><button class="gbtn">Pro 1</button><button class="gbtn">K · O</button><button class="gbtn">Pro 2</button></div>
    </div>
    <div class="console-tagline">The 1977 Classic — Rebuilt for the Browser</div>
  </div>

  <div class="team-select">
    <div style="font-size:0.6rem; font-weight:800; text-transform:uppercase; color:#3a2c10;">Select Team</div>
    <div class="team-grid" id="team-grid">
      <button class="squishy-btn" onclick="location.reload()">
        <div class="helmet-circle"><img src="./helmet_vikings.png" alt="Vikings"></div>
        <div class="squishy-name">Purple Peeps</div>
      </button>
    </div>
  </div>

  <div class="page-footer">
    <p>Tom's Love of Mattel Electronic Football Reimagined &nbsp;·&nbsp; <span>Vanilla JS · HTML5 Canvas · Retro Gaming</span></p>
  </div>

  <script>
  (function () {
    var canvas = document.getElementById('led-canvas');
    var ctx    = canvas.getContext('2d');
    canvas.width = 365; canvas.height = 133;
    function render() {
      ctx.fillStyle = '#060401'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Yard markers
      for (var c = 1; c < 10; c++) { if (c % 2 !== 0) { ctx.fillStyle = '#150800'; ctx.fillRect(c * 37, 2, 1, canvas.height - 4); } }
      // Placeholder player
      ctx.fillStyle = '#ffb040'; ctx.shadowColor = '#ff5000'; ctx.shadowBlur = 15; ctx.fillRect(100, 60, 28, 10);
    }
    render();
  })();
  </script>
</body>
</html>
