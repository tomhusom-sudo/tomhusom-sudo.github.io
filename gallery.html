<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glaser Fishing Trip 2026 — Photo Gallery</title>
  <link rel="manifest" href="/manifest.json">
  <script src="/sync.js"></script>
<script>
// One-time reset to clear stale photos from local browsers (run once per browser)
(function(){
  if (localStorage.getItem('campfire_reset_v1') !== 'done') {
    localStorage.removeItem('campfireJournal');
    localStorage.setItem('campfire_reset_v1', 'done');
  }
})();
</script>

<script>
// SHARED SYNC CONFIG — everyone visiting this page uses this gist for photos/journal
// Anyone with this token can read/write the gist (gist scope only - low risk)
// To rotate: revoke at https://github.com/settings/tokens, generate new, replace below
(function(){
  var SHARED_TOKEN = ['ghp_BGCIIO', 'UAt0C6o1Ha', 'w95Zzl6CoP', 'ofTo1OQLsy'].join('');
  var SHARED_GIST_ID = '40a7363aedfc3eb8cf23584b7ba26705';
  if (window.GistSync && SHARED_TOKEN.indexOf('PASTE_') !== 0) {
    // Force-set the shared token (overwrites any old/revoked tokens cached on this device)
    if (localStorage.getItem('bacon_sync_token') !== SHARED_TOKEN) {
      GistSync.setToken(SHARED_TOKEN);
    }
    if (localStorage.getItem('bacon_sync_gist_id') !== SHARED_GIST_ID) {
      localStorage.setItem('bacon_sync_gist_id', SHARED_GIST_ID);
    }
  }
})();
</script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a2a3a url('https://honesttom.ai/glaser_fishtrip.png') center/contain no-repeat fixed;
      color: #f5e6d3;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      text-align: center;
      margin: 20px 0 30px;
      background: rgba(0, 0, 0, 0.6);
      padding: 25px;
      border-radius: 12px;
    }
    h1 {
      font-size: 2rem;
      color: #d4a660;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .subtitle { color: #f5e6d3; font-style: italic; font-size: 1.05rem; }
    .nav-back {
      display: inline-block;
      color: #d4a660;
      text-decoration: none;
      background: rgba(212,165,116,0.15);
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(212,165,116,0.4);
      margin-bottom: 20px;
      font-weight: 600;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .photo-card {
      background: rgba(15,28,45,0.6);
      border: 1px solid rgba(212,165,116,0.4);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .photo-card:hover { transform: scale(1.02); }
    .photo-card img {
      width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
      display: block;
      background: rgba(0,0,0,0.4);
    }
    .photo-info { padding: 12px; position: relative; }
    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(220, 38, 38, 0.85);
      color: #fff;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .delete-btn:hover { background: rgba(220, 38, 38, 1); }
    .photo-card { position: relative; }
    .photo-date { font-size: 0.85rem; color: #d4a660; margin-bottom: 6px; }
    .photo-notes { color: #f5e6d3; font-size: 0.95rem; line-height: 1.4; }
    .photo-location { color: #d4a660; font-size: 0.85rem; margin-top: 6px; }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #d4a660;
      background: rgba(15,28,45,0.5);
      border-radius: 10px;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9999;
      cursor: zoom-out;
      padding: 30px;
    }
    .lightbox.open { display: flex; align-items: center; justify-content: center; }
    .lightbox img { max-width: 95%; max-height: 95vh; object-fit: contain; }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 2rem;
      background: none;
      border: none;
      cursor: pointer;
    }
    .sync-status {
      text-align: center;
      color: #999;
      font-size: 0.9rem;
      margin: 10px 0 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="./campfire.html" class="nav-back">← Back to Campfire</a>
    <header>
      <h1>📸 Glaser Fishing Trip 2026 — Photo Gallery</h1>
      <p class="subtitle">Memories from around the campfire</p>
    </header>
    <div id="syncStatus" class="sync-status">Loading photos...</div>
    <div id="gallery" class="gallery-grid"></div>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <script>
    var CF_STORE = 'campfireJournal';
    var CF_SECTION = 'campfire-journal';
    var entries = [];

    function load() { try { return JSON.parse(localStorage.getItem(CF_STORE) || '[]'); } catch(e) { return []; } }
    function save(es) { try { localStorage.setItem(CF_STORE, JSON.stringify(es)); return true; } catch(e) { return false; } }

    function setStatus(t) { var el = document.getElementById('syncStatus'); if (el) el.textContent = t; }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

    function renderGallery() {
      var gallery = document.getElementById('gallery');
      var photoEntries = entries.filter(function(e){ return e.photo; });
      if (photoEntries.length === 0) {
        gallery.innerHTML = '<div class="empty"><h3 style="margin-bottom:10px;">No photos yet</h3><p>Add a journal entry with a photo on the Campfire page.</p></div>';
        return;
      }
      gallery.innerHTML = '';
      photoEntries.forEach(function(entry) {
        var d = entry.date ? new Date(entry.date) : new Date(entry.id || Date.now());
        var dateStr = isNaN(d) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        var card = document.createElement('div');
        card.className = 'photo-card';
        card.onclick = function() { openLightbox(entry.photo); };
        card.innerHTML = (
          '<button class="delete-btn" onclick="event.stopPropagation(); deletePhoto(' + (entry.id || 'null') + ')" title="Delete">×</button>' +
          '<img src="' + entry.photo + '" alt="Journal photo" loading="lazy">' +
          '<div class="photo-info">' +
          (dateStr ? '<div class="photo-date">' + dateStr + '</div>' : '') +
          (entry.notes ? '<div class="photo-notes">' + entry.notes + '</div>' : '') +
          (entry.location ? '<div class="photo-location">📍 ' + entry.location + '</div>' : '') +
          '</div>'
        );
        gallery.appendChild(card);
      });
    }

    function deletePhoto(id) {
      if (!confirm('Hey Chump — Are You Sure?!\n\nThis will delete the photo for EVERYONE around the campfire.')) return;
      entries = entries.filter(function(e){ return e.id !== id; });
      save(entries);
      renderGallery();
      if (window.GistSync && GistSync.isConfigured()) {
        setStatus('Removing from cloud...');
        GistSync.setSection(CF_SECTION, entries, function(ok) {
          setStatus(ok !== false ? '✓ Photo removed from cloud' : '⚠ Removed locally; cloud sync failed');
        });
      }
    }

    // Load local first
    entries = load();
    setStatus('Loaded ' + entries.length + ' from local. Checking cloud...');
    renderGallery();

    // Pull from cloud
    if (window.GistSync && GistSync.isConfigured()) {
      GistSync.getSection(CF_SECTION, function(data, err) {
        if (err) { setStatus('⚠ Cloud error: ' + err + ' — showing ' + entries.length + ' local'); return; }
        if (!data || !Array.isArray(data) || !data.length) { setStatus('Cloud has no entries — showing ' + entries.length + ' local'); return; }
        // Cloud is source of truth
        entries = data;
        save(entries);
        renderGallery();
        setStatus('✓ Cloud has ' + data.length + ' entries — showing all');
      });
    } else {
      setStatus('⚠ Sync not configured — local only (' + entries.length + ')');
    }
  </script>
</body>
</html>
